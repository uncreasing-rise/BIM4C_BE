services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bim4c
      POSTGRES_USER: bim4c
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bim4c_dev}
    ports:
      - '5432:5432'
    volumes:
      - bim4c_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bim4c -d bim4c']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://bim4c:${POSTGRES_PASSWORD:-bim4c_dev}@postgres:5432/bim4c?schema=public
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 30
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/main.js']
volumes:
  bim4c_postgres:
