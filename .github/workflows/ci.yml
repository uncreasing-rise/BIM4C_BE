name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bim4c
          POSTGRES_USER: bim4c
          POSTGRES_PASSWORD: bim4c
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bim4c -d bim4c"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bim4c:bim4c@localhost:5432/bim4c?schema=public
      SHADOW_DATABASE_URL: postgresql://bim4c:bim4c@localhost:5432/bim4c_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run test:e2e
      - run: npm run build
      # Migrations must apply cleanly to an empty database...
      - run: npx prisma migrate deploy
      # ...and must produce exactly schema.prisma (catches changes made outside migrations).
      - name: Check schema drift
        run: |
          PGPASSWORD=bim4c psql -h localhost -U bim4c -d bim4c -c 'CREATE DATABASE bim4c_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npm audit --omit=dev --audit-level=high
